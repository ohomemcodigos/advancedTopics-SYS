# sonar-project.properties
# Substitua <seu-usuario> pelo seu usuário/organização do SonarCloud
sonar.projectKey=<seu-usuario>_advancedtopics-sys
sonar.organization=<seu-usuario>
sonar.projectName=advancedTopics-SYS

# Fontes analisadas
sonar.sources=catalog-service/src,order-service/src,payment-service/src,user-service/src,game-store-frontend/src

# Excluir gerados, migrações e arquivos de teste do escopo principal
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/migrations/**,**/coverage/**

# Relatórios de cobertura gerados pelo Jest (lcov)
sonar.javascript.lcov.reportPaths=coverage/catalog/lcov.info,coverage/order/lcov.info,coverage/payment/lcov.info,coverage/user/lcov.info
