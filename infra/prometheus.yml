global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'gestaopedidos-api'
    static_configs:
      - targets: 
        - 'catalog-api:3000'
        - 'order-api:3000'
        - 'payment-api:3000'
        - 'user-api:3000'
    metrics_path: '/metrics'
    scheme: 'http'