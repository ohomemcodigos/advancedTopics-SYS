name: CI — advancedTopics-SYS

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

env:
  NODE_VERSION: '20.x'

jobs:
  # ── JOB 1: catalog-service (NestJS) ──────────────────────────────
  catalog-service-ci:
    name: catalog-service — Build, Lint e Testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catalog-service
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: catalog-service/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Testes unitários com cobertura
        run: npm run test:cov

      - name: Upload cobertura catalog-service
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-catalog
          path: catalog-service/coverage/

  # ── JOB 2: order-service (NestJS) ────────────────────────────────
  order-service-ci:
    name: order-service — Build, Lint e Testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: order-service
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: order-service/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Testes unitários com cobertura
        run: npm run test:cov

      - name: Upload cobertura order-service
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-order
          path: order-service/coverage/

  # ── JOB 3: payment-service (NestJS) ──────────────────────────────
  payment-service-ci:
    name: payment-service — Build, Lint e Testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-service
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: payment-service/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Testes unitários com cobertura
        run: npm run test:cov

      - name: Upload cobertura payment-service
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-payment
          path: payment-service/coverage/

  # ── JOB 4: user-service (NestJS) ─────────────────────────────────
  user-service-ci:
    name: user-service — Build, Lint e Testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user-service
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: user-service/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Testes unitários com cobertura
        run: npm run test:cov

      - name: Upload cobertura user-service
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-user
          path: user-service/coverage/

  # ── JOB 5: frontend Angular ──────────────────────────────────────
  frontend-ci:
    name: Frontend — Lint e Build Angular
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game-store-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: game-store-frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Build de produção
        run: npm run build

      - name: Testes unitários
        run: npm test -- --run

      - name: Upload dist Angular
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: game-store-frontend/dist/
          retention-days: 1

  # ── JOB 6: SonarCloud ────────────────────────────────────────────
  sonar-analysis:
    name: SonarCloud — Quality Gate
    runs-on: ubuntu-latest
    needs: [catalog-service-ci, order-service-ci, payment-service-ci, user-service-ci, frontend-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download cobertura catalog
        uses: actions/download-artifact@v4
        with:
          name: coverage-catalog
          path: ./coverage/catalog

      - name: Download cobertura order
        uses: actions/download-artifact@v4
        with:
          name: coverage-order
          path: ./coverage/order

      - name: Download cobertura payment
        uses: actions/download-artifact@v4
        with:
          name: coverage-payment
          path: ./coverage/payment

      - name: Download cobertura user
        uses: actions/download-artifact@v4
        with:
          name: coverage-user
          path: ./coverage/user

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
