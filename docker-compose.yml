# --- TEMPLATE REUTILIZÁVEL PARA AS APIS ---
x-api-defaults: &api-defaults
  networks:
    - gestaopedidos-network
  restart: unless-stopped

services:
  # --- BANCO DE DADOS CENTRAL (SQL Server) ---
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gestaopedidos-sqlserver
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=MasterKey@123!
    volumes:
      - sql-data:/var/opt/mssql # Persistência dos dados
    healthcheck:
      # Tenta rodar um comando SQL simples para verificar se o banco responde
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P MasterKey@123! -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    <<: *api-defaults

  # --- REDIS (Cache Distribuído e Adapter WebSocket) ---
  redis:
    image: redis:7-alpine
    container_name: gestaopedidos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --requirepass redissenha123
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redissenha123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *api-defaults

  # --- REDIS INSIGHT (Interface Gráfica de Monitoramento) ---
  redisinsight:
    image: redis/redisinsight:latest
    container_name: gestaopedidos-redisinsight
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy
    <<: *api-defaults

  # --- RABBITMQ (Mensageria por Filas) ---
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gestaopedidos-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # Painel administrativo
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *api-defaults

  # --- PROMETHEUS (Coleta de Métricas) ---
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: gestaopedidos-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    <<: *api-defaults

  # --- GRAFANA (Dashboards Visuais) ---
  grafana:
    image: grafana/grafana:10.4.0
    container_name: gestaopedidos-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=gestaopedidos@2025
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    <<: *api-defaults

  # --- MICROSSERVIÇO: CATALOG SERVICE ---
  catalog-api:
    build:
      context: ./catalog-service
    container_name: gestaopedidos-catalog-api
    ports:
      - "5000:3000" 
    environment:
      - NODE_ENV=production
    depends_on:
      redis:
        condition: service_healthy
      sqlserver:
        condition: service_started
    <<: *api-defaults

  # --- MICROSSERVIÇO: ORDER SERVICE ---
  order-api:
    build:
      context: ./order-service
    container_name: gestaopedidos-order-api
    ports:
      - "5002:3000" 
    environment:
      - JWT_SECRET=senha_doida_uaulegauuuu_567364537@#@
      - NODE_ENV=production
      - REDIS_HOST=redis
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *api-defaults

  # --- MICROSSERVIÇO: PAYMENT SERVICE ---
  payment-api:
    build:
      context: ./payment-service
    container_name: gestaopedidos-payment-api
    ports:
      - "5003:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      rabbitmq:
        condition: service_healthy
    <<: *api-defaults

  # --- MICROSSERVIÇO: USER SERVICE ---
  user-api:
    build:
      context: ./user-service
    container_name: gestaopedidos-user-api
    ports:
      - "5001:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      sqlserver:
        condition: service_started
    <<: *api-defaults

networks:
  gestaopedidos-network:
    driver: bridge

volumes:
  redis-data:
  sql-data:
  grafana-data: